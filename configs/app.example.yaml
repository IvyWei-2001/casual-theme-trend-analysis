# Optional local YAML configuration. Do not put credentials in this file.
app_name: casual-theme-trend-analysis
environment: development
database_path: data/casual_theme_trends.duckdb
log_level: INFO

# Sensor Tower market request and local selection settings. Credentials belong
# in the local .env file or environment variables, never in this file.
sensor_tower_api_url: https://api.sensortower.com
sensor_tower_api_limit: 1200
sensor_tower_final_top_n: 1000
sensor_tower_allowed_genres:
  - Puzzle
  - Tabletop
sensor_tower_exclude_china_revenue_market: true
sensor_tower_scope_name: casual_puzzle_tabletop
sensor_tower_timeout_seconds: 30.0
