# Optional local YAML configuration. Do not put credentials in this file.
app_name: casual-theme-trend-analysis
environment: development
database_path: data/casual_theme_trends.duckdb
export_directory: data/exports
metadata_cache_max_age_days: 14
log_level: INFO

# Sensor Tower market request and local selection settings. Credentials belong
# in the local .env file or environment variables, never in this file.
sensor_tower_api_url: https://api.sensortower.com
sensor_tower_endpoint_path: /v1/unified/sales_report_estimates_comparison_attributes
sensor_tower_category: 7012
sensor_tower_country: WW
sensor_tower_device_type: total
sensor_tower_custom_tags_mode: include_unified_apps
sensor_tower_data_model: DM_2025_Q2
sensor_tower_filter_field_name: Game Genre
sensor_tower_filter_global: true
sensor_tower_filter_exclude: false
sensor_tower_api_limit: 1200
sensor_tower_final_top_n: 1000
sensor_tower_allowed_genres:
  - Puzzle
  - Tabletop
sensor_tower_exclude_china_revenue_market: true
sensor_tower_scope_name: casual_puzzle_tabletop
sensor_tower_timeout_seconds: 30.0

# Sensor Tower unified app metadata enrichment settings.
sensor_tower_metadata_endpoint_path: /v1/unified/apps
sensor_tower_metadata_batch_size: 50
sensor_tower_metadata_app_id_type: unified
sensor_tower_metadata_fields:
  - name
  - publisher
  - android_publisher_ids
  - itunes_publisher_ids
  - android_apps
  - itunes_apps
  - unified_app_id
sensor_tower_metadata_max_retries: 2
sensor_tower_metadata_retry_delay_seconds: 1.5
sensor_tower_metadata_batch_delay_seconds: 0.3
